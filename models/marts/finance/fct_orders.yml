models:
  - name: fct_orders
    description: >
      Comprehensive view of customer orders including order ID, customer ID,
      order date, status, total amount, gift card usage, and return flag.
      The central table for order trends, customer purchasing behaviour, and revenue analysis.
    config:
      tags: ["mart", "finance", "published"]
      meta:
        owner: "data"
        layer: "mart"
        domain: "finance"
        grain: "one row per order"
        primary_metric: "total_amount"
    semantic_model:
      enabled: true
      group: finance
      config:
        meta:
          owner: "data"
          domain: "finance"
          semantic_role: "orders"
    agg_time_dimension: order_date
    columns:
      - name: order_id
        description: A unique identifier for each order.
        entity:
          type: primary
          name: customer_order
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: The unique identifier of the customer who placed the order.
        entity:
          type: foreign
          name: customer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: The date on which the order was placed.
        granularity: day
        dimension:
          type: time
      - name: order_status
        description: The current status of the order (for example placed, shipped, completed, returned).
        dimension:
          type: categorical
      - name: amount
        description: The total monetary value of the order.
      - name: gift_card_amount
        description: The portion of the order amount paid using a gift card.
      - name: credit_card_amount
        description: The portion of the order amount paid using a credit card.
      - name: total_refund_amount
        description: Total state-demo refund amount attached to the order.
        data_tests:
          - not_null
      - name: approved_refund_amount
        description: Approved state-demo refund amount attached to the order.
        data_tests:
          - not_null
      - name: pending_refund_amount
        description: Pending state-demo refund amount attached to the order.
        data_tests:
          - not_null
      - name: net_amount
        description: Order amount after subtracting state-demo refunds.
        data_tests:
          - not_null
      - name: order_item_count
        description: Number of state-demo order item rows attached to the order.
        data_tests:
          - not_null
      - name: item_quantity
        description: Total state-demo item quantity attached to the order.
        data_tests:
          - not_null
      - name: item_subtotal
        description: State-demo item subtotal calculated from quantity and unit price.
        data_tests:
          - not_null
      - name: distinct_product_count
        description: Number of distinct state-demo product SKUs attached to the order.
        data_tests:
          - not_null
      - name: campaign_count
        description: Number of distinct state-demo campaigns attached to the order.
        data_tests:
          - not_null
      - name: primary_campaign_id
        description: Representative campaign_id for state-demo attribution.
      - name: campaign_name
        description: Representative state-demo campaign name.
      - name: campaign_channel
        description: State-demo campaign channel, or multi_channel when multiple channels apply.
      - name: shipment_count
        description: Number of state-demo shipment events attached to the order.
        data_tests:
          - not_null
      - name: latest_shipped_at
        description: Latest state-demo shipped date for the order.
      - name: latest_delivered_at
        description: Latest state-demo delivered date for the order.
      - name: is_shipped
        description: Flag indicating whether any state-demo shipment reached shipped or delivered status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_delivered
        description: Flag indicating whether any state-demo shipment reached delivered status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_fulfillment_return
        description: Flag indicating whether any state-demo shipment reached returned status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: refund_count
        description: Number of state-demo refund events attached to the order.
        data_tests:
          - not_null
      - name: has_approved_refund
        description: Flag indicating whether the order has an approved state-demo refund.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: has_pending_refund
        description: Flag indicating whether the order has a pending state-demo refund.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_state_demo_order
        description: Flag indicating whether generated state_demo data is attached to the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_return
        description: Flag indicating whether the order was returned or is pending return (1 = yes, 0 = no).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
    metrics:
      - name: total_amount
        description: The total monetary value of all orders.
        label: Total Order Amount
        type: simple
        agg: sum
        expr: amount
      - name: gift_card_amount
        description: The total order amount paid using gift cards.
        label: Gift Card Amount
        type: simple
        agg: sum
        expr: gift_card_amount
      - name: total_net_amount
        description: The total order amount after state-demo refunds.
        label: Total Net Order Amount
        type: simple
        agg: sum
        expr: net_amount
      - name: total_refund_amount
        description: The total state-demo refund amount.
        label: Total Refund Amount
        type: simple
        agg: sum
        expr: total_refund_amount
      - name: state_demo_order_count
        description: The number of orders with attached state_demo enrichment.
        label: State Demo Order Count
        type: simple
        agg: sum
        expr: is_state_demo_order
      - name: count_order
        description: The total number of orders placed.
        label: Order Count
        type: simple
        agg: count
        expr: order_id
      - name: count_ordering_customer
        description: The distinct number of customers with at least one order in the filtered slice.
        label: Ordering Customer Count
        type: simple
        agg: count_distinct
        expr: customer_id
      - name: return_count
        description: The number of orders that were returned or are pending return.
        label: Return Count
        type: simple
        agg: sum
        expr: is_return
      - name: avg_order_value
        description: The average revenue per order.
        label: Average Order Value
        type: ratio
        numerator: total_amount
        denominator: count_order
      - name: revenue_per_customer
        description: Average revenue per ordering customer in the filtered slice.
        label: Revenue per Ordering Customer
        type: ratio
        numerator: total_amount
        denominator: count_ordering_customer
      - name: orders_per_customer
        description: Average number of orders per ordering customer in the filtered slice.
        label: Orders per Ordering Customer
        type: ratio
        numerator: count_order
        denominator: count_ordering_customer
      - name: gift_card_rate
        description: The share of revenue paid using gift cards.
        label: Gift Card Rate
        type: ratio
        numerator: gift_card_amount
        denominator: total_amount
      - name: refund_amount_rate
        description: The share of gross order amount refunded in state_demo data.
        label: Refund Amount Rate
        type: ratio
        numerator: total_refund_amount
        denominator: total_amount
      - name: return_rate
        description: The proportion of orders that were returned or are pending return.
        label: Return Rate
        type: ratio
        numerator: return_count
        denominator: count_order
      - name: cumulative_revenue
        description: Running total of order revenue from the start of each month.
        label: Cumulative Revenue (MTD)
        type: cumulative
        input_metric: total_amount
        grain_to_date: month
