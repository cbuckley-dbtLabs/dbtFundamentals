models:
  - name: dim_customers
    description: >
      Comprehensive customer dimension with personal details, order history,
      behavioural segmentation, and retention signals.
    config:
      tags: ["mart", "marketing", "published"]
      meta:
        owner: "data"
        layer: "mart"
        domain: "marketing"
        grain: "one row per customer"
        contains_pii: true
    semantic_model:
      enabled: true
      group: marketing
      config:
        meta:
          owner: "data"
          domain: "marketing"
          semantic_role: "customers"
    agg_time_dimension: first_order_date
    columns:
      - name: customer_id
        description: A unique identifier for each customer.
        entity:
          type: primary
          name: customer
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: The customer's first name.
      - name: last_name
        description: The customer's last name.
      - name: first_order_date
        description: The date when the customer placed their first order.
        granularity: day
        dimension:
          type: time
      - name: most_recent_order_date
        description: The date when the customer placed their most recent order.
        granularity: day
        dimension:
          type: time
      - name: customer_segment
        description: Behavioural segment based on order frequency (No Orders / New / Repeat / Loyal).
        dimension:
          type: categorical
      - name: number_of_orders
        description: The total number of orders placed by the customer.
      - name: lifetime_value
        description: The total revenue generated by the customer over their lifetime.
      - name: lifetime_net_value
        description: The customer's lifetime order revenue after state-demo refunds.
      - name: lifetime_refund_amount
        description: Total state-demo refund amount attributed to the customer.
      - name: state_demo_order_count
        description: Number of customer orders with attached state_demo enrichment.
      - name: avg_days_between_orders
        description: >
          Average number of days between consecutive orders for this customer.
          Null for customers with only one order.
      - name: days_since_last_order
        description: >
          Number of days between the customer's most recent order and today.
          Useful for churn risk identification.
    derived_semantics:
      dimensions:
        - name: customer_value_tier
          type: categorical
          label: Customer Value Tier
          expr: |
            case
              when lifetime_value >= 150 then 'High Value'
              when lifetime_value >= 75 then 'Mid Value'
              else 'Low Value'
            end
    metrics:
      - name: count_customers
        description: The total number of customers in the filtered slice.
        label: Customer Count
        type: simple
        agg: count_distinct
        expr: customer_id
      - name: count_loyal_customers
        description: The number of customers in the Loyal behavioural segment.
        label: Loyal Customer Count
        type: simple
        agg: count_distinct
        expr: customer_id
        filter: |
          {{ Dimension('customer__customer_segment') }} = 'Loyal'
      - name: total_customer_lifetime_value
        description: The total lifetime revenue across all customers.
        label: Total Customer Lifetime Value
        type: simple
        agg: sum
        expr: lifetime_value
      - name: total_customer_net_value
        description: The total lifetime customer revenue after state-demo refunds.
        label: Total Customer Net Value
        type: simple
        agg: sum
        expr: lifetime_net_value
      - name: total_customer_refund_amount
        description: The total state-demo refund amount attributed to customers.
        label: Total Customer Refund Amount
        type: simple
        agg: sum
        expr: lifetime_refund_amount
      - name: total_customer_orders
        description: The total number of orders placed across all customers.
        label: Total Customer Orders
        type: simple
        agg: sum
        expr: number_of_orders
      - name: avg_customer_lifetime_value
        description: The average lifetime revenue per customer.
        label: Average Customer Lifetime Value
        type: simple
        agg: average
        expr: lifetime_value
      - name: avg_orders_per_customer
        description: The average number of orders per customer.
        label: Average Orders per Customer
        type: simple
        agg: average
        expr: number_of_orders
      - name: avg_days_since_last_order
        description: The average recency of customers' most recent orders. Higher values indicate churn risk.
        label: Average Days Since Last Order
        type: simple
        agg: average
        expr: days_since_last_order
      - name: customer_refund_rate
        description: The share of customer lifetime value refunded in state_demo data.
        label: Customer Refund Rate
        type: ratio
        numerator: total_customer_refund_amount
        denominator: total_customer_lifetime_value
      - name: loyal_customer_share
        description: The proportion of customers in the Loyal behavioural segment.
        label: Loyal Customer Share
        type: ratio
        numerator: count_loyal_customers
        denominator: count_customers
