saved_queries:
  - name: weekly_revenue_by_status
    description: Weekly order revenue and count, broken down by order status. A strong starting point for revenue performance monitoring.
    label: Weekly Revenue by Status
    config:
      tags: ["semantic_layer", "finance", "published"]
      meta:
        owner: "data"
        domain: "finance"
    query_params:
      metrics:
        - total_amount
        - count_order
        - avg_order_value
      group_by:
        - "TimeDimension('metric_time', 'week')"
        - "Dimension('customer_order__order_status')"

  - name: monthly_return_analysis
    description: Monthly return count and return rate alongside total revenue, to surface quality or fulfilment issues over time.
    label: Monthly Return Analysis
    config:
      tags: ["semantic_layer", "finance", "quality"]
      meta:
        owner: "data"
        domain: "finance"
    query_params:
      metrics:
        - return_count
        - return_rate
        - total_amount
        - count_order
      group_by:
        - "TimeDimension('metric_time', 'month')"
        - "Dimension('customer_order__order_status')"
